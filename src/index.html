<!-- Evitar que el navegador guarde la página en caché -->
<!-- Esto fuerza a recargar siempre desde el servidor -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<!-- Script para forzar recarga si la página viene del caché del navegador -->
<!-- Útil cuando el usuario navega con los botones de atrás/adelante -->
<script>
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) location.reload(); // Si viene del caché, recargar
  });
</script>

<!-- Componente raíz de Angular donde se carga toda la aplicación -->
<!-- El texto "Cargando..." se muestra mientras Angular se inicializa -->
<app-root>Cargando...</app-root>

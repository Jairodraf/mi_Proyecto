<!-- Encabezado de bienvenida -->
<div class="col-12 mb-3 text-center">
  <h1 style="color:#001529;font-size:30px;">¡Le damos la bienvenida!</h1>
  <h3 style="color:#001529;font-size:20px;">Por favor, inicie sesión para continuar.</h3>
</div>

<!-- Contenedor principal -->
<div class="login-container">
  <div class="card shadow-sm">
    <div class="card-body">
      <!-- Formulario de inicio de sesión -->
      <form nz-form [formGroup]="validateForm" class="login-form" (ngSubmit)="submitForm()" novalidate>
        <nz-form-item>
          <nz-form-label>Correo electrónico</nz-form-label>
          <nz-form-control nzErrorTip="Ingrese un correo válido">
            <nz-input-group [nzPrefix]="emailIconTemplate">
              <input
                nz-input
                type="email"
                formControlName="email"
                placeholder="correo@empresa.com"
                autocomplete="email"
              />
            </nz-input-group>
            <ng-template #emailIconTemplate>
              <span nz-icon nzType="mail" nzTheme="outline" style="font-size: 18px; color: rgba(0, 0, 0, 0.45);"></span>
            </ng-template>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label>Contraseña</nz-form-label>
          <nz-form-control nzErrorTip="Ingrese su contraseña (mín. 6 caracteres)">
            <nz-input-group [nzPrefix]="lockIconTemplate" [nzSuffix]="suffixTemplate">
              <input
                nz-input
                [type]="passwordVisible ? 'text' : 'password'"
                formControlName="contrasena"
                placeholder="Contraseña"
                autocomplete="current-password"
              />
            </nz-input-group>
            <ng-template #lockIconTemplate>
              <span nz-icon nzType="lock" nzTheme="outline" style="font-size: 18px; color: rgba(0, 0, 0, 0.45);"></span>
            </ng-template>
            <ng-template #suffixTemplate>
              <span
                nz-icon
                [nzType]="passwordVisible ? 'eye-invisible' : 'eye'"
                (click)="passwordVisible = !passwordVisible"
                style="cursor: pointer; font-size: 18px; color: rgba(0, 0, 0, 0.45);"
              ></span>
            </ng-template>
          </nz-form-control>
        </nz-form-item>

        <button
          nz-button
          nzType="primary"
          class="btn btn-primary btn-lg w-100 login-form-button"
          htmlType="submit"
          [nzLoading]="loading"
          [disabled]="validateForm.invalid"
        >
          Ingresar
        </button>
      </form>
    </div>
  </div>
</div>

<!-- Modal de error de credenciales -->
<div *ngIf="showLoginError" class="modal-backdrop-app">
  <div class="modal-card-app">
    <div class="modal-header-app bg-warning text-dark">
      Error de autenticación
    </div>
    <div class="modal-body-app">
      <p class="mb-0 text-center">El usuario o la contraseña no son correctos</p>
    </div>
    <div class="modal-footer-app justify-content-center">
      <button class="btn btn-warning" (click)="closeLoginError()">Aceptar</button>
    </div>
  </div>
</div>

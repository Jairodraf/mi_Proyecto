<!-- Encabezado de bienvenida -->
<div class="col-12 mb-3 text-center">
  <h1 style="color: #001529; font-size: 30px;">¡Le damos la bienvenida!</h1>
  <h3 style="color: #001529; font-size: 20px;">Por favor, inicie sesión para continuar.</h3>
</div>

<!-- Contenedor principal -->
<div class="login-container">
  <div class="card shadow-sm">
    <div class="card-body">
      <!-- Formulario de inicio de sesión -->
      <form
        nz-form
        [formGroup]="validateForm"
        class="login-form"
        (ngSubmit)="submitForm()"
      >
        <nz-form-item>
          <nz-form-label>Correo electrónico</nz-form-label>
          <nz-form-control nzErrorTip="Por favor ingrese su nombre de usuario!">
            <nz-input-group nzPrefixIcon="user">
              <input
                type="text"
                nz-input
                formControlName="username"
                placeholder="Usuario"
              />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label>Contraseña</nz-form-label>
          <nz-form-control nzErrorTip="Por favor ingrese su contraseña!">
            <nz-input-group nzPrefixIcon="lock">
              <input
                type="password"
                nz-input
                formControlName="password"
                placeholder="Contraseña"
                autocomplete="new-password"
              />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>

        <button class="btn btn-primary btn-lg w-100 login-form-button" routerLink="/fichaje">
          Ingresar
        </button>
      </form>
    </div>
  </div>
</div>

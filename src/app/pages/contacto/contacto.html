<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <!-- Encabezado de contacto -->
    <div class="col-12 mb-4">
      <div class="page-header-box">
        <h1>Contacto</h1>
      </div>
    </div>

    <!-- Formulario de contacto -->
    <div class="col-lg-8 col-xl-7">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex align-items-center justify-content-center" style="min-height: 60px;">
          <h5 class="mb-0 fw-bold fs-5">Formulario de Contacto</h5>
        </div>
        <div class="card-body">
            <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" style="margin-left: 10px;" id="nombre" name="nombre"
                       [(ngModel)]="nombre" autocomplete="off" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" style="margin-left: 10px;" id="email" name="email"
                       [(ngModel)]="email" autocomplete="off" required>
              </div>

              <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea class="form-control" style="margin-left: 10px;" id="mensaje" name="mensaje" rows="10"
                         [(ngModel)]="mensaje" minlength="10" required autocomplete="off"></textarea>
              </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 login-form-button">
              Enviar
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

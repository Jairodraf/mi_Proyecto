<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <!-- Encabezado de contacto -->
    <div class="col-12 mb-4">
      <div class="page-header-box">
        <h1>Contacto</h1>
      </div>
    </div>

    <!-- Formulario de contacto -->
    <div class="col-lg-8 col-xl-7">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex align-items-center justify-content-center" style="min-height: 60px;">
          <h5 class="mb-0 fw-bold fs-5">Formulario de Contacto</h5>
        </div>
        <div class="card-body">
            <form action="ContactoServlet" method="post" class="needs-validation" novalidate>
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" style="margin-left: 10px;" id="nombre" name="nombre"
                       autocomplete="off" required>
                <div class="invalid-feedback">Introduce tu nombre.</div>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" style="margin-left: 10px;" id="email" name="email"
                       autocomplete="off" required>
                <div class="invalid-feedback">Introduce un email válido.</div>
              </div>

              <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea class="form-control" style="margin-left: 10px;" id="mensaje" name="mensaje" rows="10" style="width: 100%;"
                         minlength="10" required autocomplete="off"></textarea>
                <div class="invalid-feedback">El mensaje debe tener al menos 10 caracteres.</div>
              </div>

            <button class="btn btn-primary btn-lg w-100 login-form-button">
              Enviar
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

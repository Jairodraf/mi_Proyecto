<div class="page-container">
  <ng-container>
    <!-- HEADER: visible en todas menos /login -->
    <app-header *ngIf="!isLoginPage()"></app-header>

    <!-- MAIN: añade padding-top solo si hay header fijo -->
    <main [ngClass]="{ 'pt-navbar': !isLoginPage() }">
      <router-outlet></router-outlet>
    </main>

    <!-- FOOTER: también oculto en /login si quieres -->
    <app-footer *ngIf="!isLoginPage()"></app-footer>
  </ng-container>
</div>
